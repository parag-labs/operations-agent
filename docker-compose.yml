services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped

  # Optional Postgres for the self-host persistence layer (the Store implementation in
  # src/db). The demo app runs client-side and does not require it; bring it up if you want
  # to run `pnpm db:migrate` or the integration test against a real database.
