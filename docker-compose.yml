services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: operations_agent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Remove DATABASE_URL to run with the in-memory store instead.
      DATABASE_URL: postgres://postgres:postgres@db:5432/operations_agent
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
